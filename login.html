<main>

<div class="container d-flex justify-content-center align-items-center min-vh-100 py-4">
  <div class="card shadow-sm p-4" style="max-width: 400px; width: 100%;">
<section aria-labelledby="titulo-login">
<h1 id="titulo-login">Iniciar Sesión</h1>
<!-- form: define el formulario. action indica a dónde se envían los datos -->
<form action="#" method="POST">
<!-- fieldset agrupa campos; legend describe el grupo -->
<fieldset class="mb-3">
    <legend class="fs-6 fw-bold">Credenciales de acceso</legend>
    <div class="mb-3">
    <label for="correo" class="form-label">Correo electrónico</label>
    <input type="email" id="correo" name="correo" class="form-control"
            placeholder="ejemplo@correo.com" required>
    </div>

    <div class="mb-3">
    <label for="password" class="form-label">Contraseña</label>
    <input type="password" id="password" name="password" class="form-control" required>
    </div>
    <div class="mb-3 form-check">
    <input type="checkbox" id="recordar" name="recordar" class="form-check-input">
    <label for="recordar" class="form-check-label">Recordarme en este dispositivo</label>
    </div>
    <button type="submit" class="btn btn- w-100">Ingresar</button>
</fieldset>
</form>
<p class="text-center mt-3 mb-1">
  <a href="#">¿Olvidaste tu contraseña?</a>
</p>
<p class="text-center">
  ¿No tienes una cuenta? <a href="#">Regístrate aquí</a>
</p>
